<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AI e-Learning</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; margin: 0; }
    .card { text-align: center; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { font-size: 1.1rem; opacity: 0.9; }
    button { margin-top: 1.5rem; padding: 0.75rem 2rem; border-radius: 9999px; border: none;
             background: white; color: #667eea; font-weight: 600; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:4rem; margin-bottom:1rem;">&#128225;</div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
