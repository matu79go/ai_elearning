# 本番環境用（さくらVPS）
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# 前提:
#   - .env.prod を用意（.env.prod.example を参考に）
#   - credentials/ にGoogle Drive OAuthトークンを配置

services:
  db:
    image: mysql:8.0
    container_name: elearn_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-config/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearn_app
    working_dir: /app
    entrypoint: ["/entrypoint.sh"]
    command: gunicorn -w 2 -b 0.0.0.0:5000 --timeout 120 "app:create_app()"
    ports:
      - "80:5000"
    volumes:
      - .:/app
      - ./credentials:/app/credentials:ro
    environment:
      - FLASK_APP=${FLASK_APP}
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL_SCORING=${LLM_MODEL_SCORING}
      - LLM_MODEL_GENERATE=${LLM_MODEL_GENERATE}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OAK_API_KEY=${OAK_API_KEY}
      - LLM_MODEL_EXPLAIN=${LLM_MODEL_EXPLAIN}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
      - TZ=Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  mysql_data:
